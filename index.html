<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pratham Apps Hub</title>
<style>
/* 1. MOBILE LOCKDOWN */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow-x: hidden; /* Stops horizontal moving/wobbling */
  background-color: #020617;
  font-family: 'Inter', system-ui, sans-serif;
  color: white;
  position: relative;
  /* Smooths out mobile scrolling */
  -webkit-overflow-scrolling: touch; 
  touch-action: manipulation;
}

/* 2. BACKGROUND BLOBS (Mobile Optimized) */
body::before, body::after {
  content: "";
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(80px);
  z-index: -1;
  opacity: 0.25;
  pointer-events: none; /* Prevents blobs from interfering with clicks */
  animation: move 20s infinite alternate;
}

body::before { background: #38bdf8; top: -50px; left: -50px; }
body::after { background: #6366f1; bottom: -50px; right: -50px; }

@keyframes move {
  from { transform: translate(0, 0); }
  to { transform: translate(50px, 50px); }
}

header {
  text-align: center;
  padding: 60px 20px 20px;
  box-sizing: border-box;
}

#greeting-box {
  color: #38bdf8;
  font-weight: 600;
  margin-bottom: 10px;
}

header h1 {
  font-size: 2.5rem; /* Scaled down for mobile screens */
  margin: 0;
  background: linear-gradient(135deg, #fff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1px;
}

/* 3. RESPONSIVE GRID */
.container {
  display: grid;
  /* Standard 1 column on mobile, 2+ on tablets */
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  padding: 20px;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  box-sizing: border-box; /* Crucial: padding doesn't widen the container */
}

/* 4. GLASS CARDS */
.card {
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 28px;
  padding: 30px;
  text-align: center;
  transition: transform 0.3s ease;
  /* Prevents selection highlighting on tap */
  -webkit-tap-highlight-color: transparent; 
}

.card:active {
  transform: scale(0.98); /* Tactile feedback on mobile tap */
}

.icon-box {
  font-size: 40px;
  margin-bottom: 15px;
  background: rgba(255, 255, 255, 0.05);
  width: 80px;
  height: 80px;
  line-height: 80px;
  border-radius: 22px;
  display: inline-block;
}

.card h3 { font-size: 1.4rem; margin: 10px 0; }
.card p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }

.card button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: white;
  color: #020617;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
}

/* 5. FOOTER */
footer {
  text-align: center;
  padding: 40px 20px;
}

.logout-btn {
  background: transparent;
  color: #ef4444;
  border: 1px solid rgba(239,68,68,0.3);
  padding: 8px 20px;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <div id="greeting-box">
    <span id="time-greeting">Hello</span>, <span id="user-name" style="color: white; text-transform: capitalize;">Explorer</span>!
  </div>
  <h1>PRATHAM APPS</h1>
</header>

<div class="container">
  <div class="card">
    <div class="icon-box">🧮</div>
    <h3>Calculator</h3>
    <button onclick="location.href='calculator.html'">Launch</button>
  </div>

  <div class="card">
    <div class="icon-box">❌</div>
    <h3>Tic Tac Toe</h3>
    <button onclick="location.href='tictactoe.html'">Play</button>
  </div>

  <div class="card">
    <div class="icon-box">🐦</div>
    <h3>Flappy Bird</h3>
    <button onclick="location.href='flappy.html'">Fly</button>
  </div>

  <div class="card">
    <div class="icon-box">♟️</div>
    <h3>Pro Chess</h3>
    <button onclick="location.href='chess.html'">Enter</button>
  </div>
</div>

<footer>
  <button class="logout-btn" onclick="logout()">Logout</button>
</footer>

<script>
  if(localStorage.getItem("loggedIn") !== "true"){
    window.location.replace("login.html");
  } else {
    const user = localStorage.getItem("user") || "User";
    document.getElementById("user-name").innerText = user;
    const hours = new Date().getHours();
    let message = hours < 12 ? "Good morning" : hours < 18 ? "Good afternoon" : "Good evening";
    document.getElementById("time-greeting").innerText = message;
  }

  function logout(){
    localStorage.clear();
    window.location.replace("login.html");
  }
</script>

</body>
</html>
