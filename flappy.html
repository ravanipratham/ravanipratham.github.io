<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Flappy | Pratham Apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 1. DYNAMIC THEME */
  body {
    margin: 0;
    background: #020617;
    background: radial-gradient(circle at top right, #1e1b4b, #020617);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .game-container {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 30px;
    border-radius: 35px;
    text-align: center;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    position: relative;
  }

  h2 {
    font-size: 1.8rem;
    margin: 0 0 15px 0;
    background: linear-gradient(to right, #fbbf24, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  canvas {
    background: linear-gradient(#0f172a, #1e293b);
    border-radius: 20px;
    display: block;
    margin: auto;
    border: 2px solid rgba(255,255,255,0.05);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }

  /* 2. CONTROLS */
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  select, button {
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
  }

  select {
    background: rgba(255, 255, 255, 0.05);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.1);
    outline: none;
  }

  .start-btn { background: #38bdf8; color: #020617; }
  .home-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; }

  button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

  /* Score Overlay */
  #score-display {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    font-weight: 800;
    opacity: 0.8;
    pointer-events: none;
  }
</style>
</head>

<body>

<div class="game-container">
  <h2>🐦 NEON FLAPPY</h2>
  
  <div id="score-display">0</div>

  <canvas id="game" width="320" height="420"></canvas>

  <div class="controls">
    <select id="difficulty">
      <option value="easy">🟢 Easy</option>
      <option value="medium" selected>🟡 Mid</option>
      <option value="hard">🔴 Hard</option>
    </select>

    <button class="start-btn" onclick="startGame()">▶ Play</button>
    <button class="home-btn" onclick="location.href='index.html'">⬅ Home</button>
  </div>
</div>

<script>
// Security Check
if(localStorage.getItem("loggedIn") !== "true") window.location.replace("login.html");

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreTag = document.getElementById("score-display");

let birdY, birdV, score, game, pipeSpeed, pipeGap, pipes, anim;
const gravity = 0.4;

function startGame(){
  cancelAnimationFrame(anim);
  const d = document.getElementById("difficulty").value;
  
  if(d === "easy"){ pipeSpeed = 2; pipeGap = 160; }
  else if(d === "medium"){ pipeSpeed = 3; pipeGap = 130; }
  else { pipeSpeed = 4.2; pipeGap = 110; }

  birdY = canvas.height / 2;
  birdV = 0;
  pipes = [];
  score = 0;
  scoreTag.innerText = "0";
  game = true;
  loop();
}

window.addEventListener("keydown", e => { if(e.code === "Space") jump(); });
canvas.addEventListener("mousedown", jump);
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });

function jump(){ if(game) birdV = -7; }

function drawBird(){
  // Neon Glow Bird
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#fbbf24";
  ctx.fillStyle = "#fbbf24";
  ctx.beginPath();
  ctx.arc(60, birdY, 12, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.shadowBlur = 0; // Reset shadow for other drawings
  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(65, birdY - 3, 2, 0, Math.PI * 2);
  ctx.fill();
}

function loop(){
  if(!game) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  birdV += gravity;
  birdY += birdV;
  drawBird();

  // Pipe Generation
  if(pipes.length === 0 || pipes[pipes.length - 1].x < 160){
    let top = Math.random() * (canvas.height - pipeGap - 100) + 50;
    pipes.push({ x: canvas.width, top, passed: false });
  }

  pipes.forEach(p => {
    p.x -= pipeSpeed;
    
    // Draw Neon Pipes
    let grad = ctx.createLinearGradient(p.x, 0, p.x + 45, 0);
    grad.addColorStop(0, "#38bdf8");
    grad.addColorStop(1, "#1e40af");
    ctx.fillStyle = grad;
    
    ctx.fillRect(p.x, 0, 45, p.top);
    ctx.fillRect(p.x, p.top + pipeGap, 45, canvas.height);

    // Scoring
    if(p.x < 60 && !p.passed){
      score++;
      scoreTag.innerText = score;
      p.passed = true;
    }

    // Collision
    if(60 + 10 > p.x && 60 - 10 < p.x + 45 && (birdY - 10 < p.top || birdY + 10 > p.top + pipeGap)){
      endGame();
    }
  });

  pipes = pipes.filter(p => p.x > -50);
  if(birdY > canvas.height || birdY < 0) endGame();

  anim = requestAnimationFrame(loop);
}

function endGame(){
  game = false;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#ef4444";
  ctx.font = "bold 30px Inter";
  ctx.textAlign = "center";
  ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2);
}
</script>
</body>
</html>
