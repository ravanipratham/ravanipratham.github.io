<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe | Pratham Hub</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23ffffff'/><path d='M35 25h20c15 0 20 10 20 17.5S70 60 55 60H45v15h-10V25zm10 25h10c5 0 10-2 10-7.5s-5-7.5-10-7.5H45v15z' fill='%2338bdf8'/></svg>">

    <style>
        :root {
            --bg-main: #f3f4f6;
            --grid-color: #e5e7eb;
            --text-dark: #0f172a;
            --grad-blue: linear-gradient(135deg, #00d2ff, #3a7bd5);
            --grad-pink: linear-gradient(135deg, #ff007a, #7928ca);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-main);
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            touch-action: manipulation;
        }

        header { padding: 30px 20px 10px; text-align: center; }
        .turn-indicator { color: #10b981; font-weight: 800; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; min-height: 20px;}
        h1 { font-size: 2.2rem; font-weight: 900; margin: 0; color: var(--text-dark); text-transform: uppercase; letter-spacing: -1px; }

        /* THE ARENA (BOARD) */
        .board-container {
            background: white;
            padding: 20px; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            margin-top: 10px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .board {
            display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); gap: 12px;
        }
        @media (max-width: 350px) { .board { grid-template-columns: repeat(3, 25vw); grid-template-rows: repeat(3, 25vw); } }

        .cell {
            background: #f8fafc;
            border-radius: 16px; border: 2px solid #e2e8f0;
            display: flex; justify-content: center; align-items: center;
            font-size: 3.5rem; font-weight: 900;
            cursor: pointer; transition: 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            -webkit-tap-highlight-color: transparent;
        }
        .cell:active { transform: scale(0.95); background: #f1f5f9; }

        .x-mark { background: var(--grad-blue); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .o-mark { background: var(--grad-pink); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* OVERLAYS & MODALS */
        .overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .modal {
            background: white; padding: 40px 30px; border-radius: 24px; text-align: center; width: 85%; max-width: 350px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .modal h2 { margin: 0 0 20px; font-size: 2rem; color: var(--text-dark); text-transform: uppercase; letter-spacing: -1px; }

        /* SETUP SCREEN STYLES */
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: 2px solid #e2e8f0;
            background: #f8fafc; color: var(--text-dark); font-weight: 800; font-size: 0.9rem;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .mode-btn.active { border-color: #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; }

        input {
            width: 100%; box-sizing: border-box; padding: 15px; margin-bottom: 20px;
            border-radius: 12px; border: 2px solid #e2e8f0; background: #f8fafc;
            font-size: 1rem; color: var(--text-dark); font-weight: 600; text-align: center;
            display: none; /* Hidden by default for AI mode */
        }
        input:focus { outline: none; border-color: #00d2ff; background: #ffffff; }

        /* GAMING BUTTONS */
        .controls { display: flex; gap: 10px; margin-top: 25px; width: 100%; max-width: 350px; padding: 0 20px; box-sizing: border-box;}
        button {
            padding: 15px; border-radius: 12px; border: none; width: 100%;
            font-size: 1rem; font-weight: 800; text-transform: uppercase;
            cursor: pointer; transition: 0.3s;
        }
        .btn-primary { background: var(--grad-blue); color: white; box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(0, 210, 255, 0.4); }
        .btn-secondary { background: #f1f5f9; color: var(--text-dark); border: 2px solid #e2e8f0; }
        .btn-secondary:hover { background: #e2e8f0; }

        #game-over-modal { display: none; } /* Hidden initially */
    </style>
</head>
<body>

<header>
    <div class="turn-indicator" id="turn-indicator">System Loading...</div>
    <h1>Tic Tac Toe</h1>
</header>

<div class="overlay" id="setup-overlay">
    <div class="modal">
        <h2>Match Setup</h2>
        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-ai" onclick="selectMode('ai')">1 Player</button>
            <button class="mode-btn" id="btn-pvp" onclick="selectMode('pvp')">2 Players</button>
        </div>
        <input type="text" id="p2-name" placeholder="Enter Player 2 Name" autocomplete="off">
        <button class="btn-primary" onclick="startMatch()">Start Match</button>
        <button class="btn-secondary" style="margin-top: 10px;" onclick="location.href='index.html'">Back to Hub</button>
    </div>
</div>

<div class="board-container">
    <div class="board" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>
</div>

<div class="controls">
    <button class="btn-secondary" onclick="document.getElementById('setup-overlay').style.display='flex'">Change Mode</button>
    <button class="btn-secondary" onclick="resetBoard()">Restart</button>
</div>

<div class="overlay" id="game-over-modal">
    <div class="modal">
        <h2 id="winner-text">Game Over</h2>
        <button class="btn-primary" onclick="resetBoard()">Play Again</button>
        <button class="btn-secondary" style="margin-top: 10px;" onclick="document.getElementById('setup-overlay').style.display='flex'; document.getElementById('game-over-modal').style.display='none';">Setup New Match</button>
    </div>
</div>

<script>
    if(localStorage.getItem("loggedIn") !== "true") window.location.replace("login.html");

    // GAME STATE VARIABLES
    let board = ["", "", "", "", "", "", "", "", ""];
    let gameActive = false;
    let gameMode = "ai"; // "ai" or "pvp"
    let currentMark = "X";
    let isAiThinking = false;
    
    // PLAYER INFO
    let player1Name = localStorage.getItem("user") || "Player 1";
    let player2Name = "Computer";

    const winConditions = [ [0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6] ];

    // --- MATCH SETUP LOGIC ---
    function selectMode(mode) {
        gameMode = mode;
        document.getElementById('btn-ai').classList.toggle('active', mode === 'ai');
        document.getElementById('btn-pvp').classList.toggle('active', mode === 'pvp');
        document.getElementById('p2-name').style.display = mode === 'pvp' ? 'block' : 'none';
    }

    function startMatch() {
        if (gameMode === 'pvp') {
            const inputName = document.getElementById('p2-name').value.trim();
            player2Name = inputName !== "" ? inputName : "Player 2";
        } else {
            player2Name = "Computer";
        }
        document.getElementById('setup-overlay').style.display = "none";
        resetBoard();
    }

    // --- GAMEPLAY LOGIC ---
    function updateTurnIndicator() {
        const indicator = document.getElementById('turn-indicator');
        if (currentMark === "X") {
            indicator.innerText = `${player1Name}'s Turn (X)`;
            indicator.style.color = "#00d2ff"; // Blue for X
        } else {
            indicator.innerText = `${player2Name}'s Turn (O)`;
            indicator.style.color = "#ff007a"; // Pink for O
        }
    }

    function makeMove(index) {
        // Block clicks if game is over, cell is full, or AI is currently calculating
        if (board[index] !== "" || !gameActive || isAiThinking) return;

        // Player makes a move
        board[index] = currentMark;
        updateUI();
        
        if (checkWin(currentMark)) return;
        if (checkTie()) return;

        // Switch Turn
        currentMark = currentMark === "X" ? "O" : "X";
        updateTurnIndicator();

        // If it's AI mode and it's O's turn, trigger the AI
        if (gameMode === "ai" && currentMark === "O") {
            isAiThinking = true;
            setTimeout(aiMove, 400); // 400ms delay to feel like the AI is "thinking"
        }
    }

    // --- IMPOSSIBLE AI (Minimax Algorithm) ---
    function aiMove() {
        if(!gameActive) return;

        let bestScore = -Infinity;
        let move;
        for (let i = 0; i < board.length; i++) {
            if (board[i] === "") {
                board[i] = "O";
                let score = minimax(board, 0, false);
                board[i] = "";
                if (score > bestScore) { bestScore = score; move = i; }
            }
        }
        
        board[move] = "O";
        updateUI();
        
        if (checkWin("O")) { isAiThinking = false; return; }
        if (checkTie()) { isAiThinking = false; return; }

        currentMark = "X";
        updateTurnIndicator();
        isAiThinking = false;
    }

    function minimax(board, depth, isMaximizing) {
        if (checkWinnerForMinimax("O")) return 10 - depth;
        if (checkWinnerForMinimax("X")) return depth - 10;
        if (!board.includes("")) return 0;

        if (isMaximizing) {
            let bestScore = -Infinity;
            for (let i = 0; i < board.length; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, depth + 1, false);
                    board[i] = "";
                    bestScore = Math.max(score, bestScore);
                }
            }
            return bestScore;
        } else {
            let bestScore = Infinity;
            for (let i = 0; i < board.length; i++) {
                if (board[i] === "") {
                    board[i] = "X";
                    let score = minimax(board, depth + 1, true);
                    board[i] = "";
                    bestScore = Math.min(score, bestScore);
                }
            }
            return bestScore;
        }
    }

    function checkWinnerForMinimax(mark) {
        return winConditions.some(condition => condition.every(index => board[index] === mark));
    }

    // --- UI & GAME STATE MANAGEMENT ---
    function updateUI() {
        const cells = document.querySelectorAll('.cell');
        board.forEach((mark, i) => {
            cells[i].innerText = mark;
            cells[i].className = "cell"; 
            if (mark === "X") cells[i].classList.add("x-mark");
            if (mark === "O") cells[i].classList.add("o-mark");
        });
    }

    function checkWin(mark) {
        const hasWon = checkWinnerForMinimax(mark);
        if (hasWon) {
            const winnerName = mark === "X" ? player1Name : player2Name;
            endGame(`${winnerName} Wins!`);
        }
        return hasWon;
    }

    function checkTie() {
        if (!board.includes("") && gameActive) {
            endGame("It's a Draw!");
            return true;
        }
        return false;
    }

    function endGame(message) {
        gameActive = false;
        document.getElementById("winner-text").innerText = message;
        document.getElementById("game-over-modal").style.display = "flex";
    }

    function resetBoard() {
        board = ["", "", "", "", "", "", "", "", ""];
        currentMark = "X";
        gameActive = true;
        isAiThinking = false;
        document.getElementById("game-over-modal").style.display = "none";
        updateUI();
        updateTurnIndicator();
    }
</script>

</body>
</html>
