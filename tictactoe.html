<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe | Pratham Hub</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23ffffff'/><path d='M35 25h20c15 0 20 10 20 17.5S70 60 55 60H45v15h-10V25zm10 25h10c5 0 10-2 10-7.5s-5-7.5-10-7.5H45v15z' fill='%2338bdf8'/></svg>">

    <style>
        :root {
            --bg-main: #f3f4f6;
            --grid-color: #e5e7eb;
            --text-dark: #0f172a;
            --grad-blue: linear-gradient(135deg, #00d2ff, #3a7bd5);
            --grad-pink: linear-gradient(135deg, #ff007a, #7928ca);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-main);
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            touch-action: manipulation;
        }

        header { padding: 30px 20px 10px; text-align: center; }
        .system-status { color: #10b981; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        h1 { font-size: 2.2rem; font-weight: 900; margin: 0; color: var(--text-dark); text-transform: uppercase; letter-spacing: -1px; }

        /* THE ARENA (BOARD) */
        .board-container {
            background: white;
            padding: 20px; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            margin-top: 20px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .board {
            display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); gap: 12px;
        }
        @media (max-width: 350px) { .board { grid-template-columns: repeat(3, 25vw); grid-template-rows: repeat(3, 25vw); } }

        .cell {
            background: #f8fafc;
            border-radius: 16px; border: 2px solid #e2e8f0;
            display: flex; justify-content: center; align-items: center;
            font-size: 3.5rem; font-weight: 900;
            cursor: pointer; transition: 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            -webkit-tap-highlight-color: transparent;
        }
        .cell:active { transform: scale(0.95); background: #f1f5f9; }

        /* X and O Styles */
        .x-mark { background: var(--grad-blue); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .o-mark { background: var(--grad-pink); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* WIN MODAL */
        .overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal {
            background: white; padding: 40px; border-radius: 24px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal h2 { margin: 0 0 20px; font-size: 2.5rem; color: var(--text-dark); text-transform: uppercase; }

        /* GAMING BUTTONS */
        .controls { display: flex; gap: 15px; margin-top: 30px; }
        button {
            padding: 15px 25px; border-radius: 12px; border: none;
            font-size: 1rem; font-weight: 800; text-transform: uppercase;
            cursor: pointer; transition: 0.3s;
        }
        .btn-restart { background: #f1f5f9; color: var(--text-dark); border: 2px solid #e2e8f0; }
        .btn-restart:hover { background: #e2e8f0; }
        .btn-hub { background: var(--grad-blue); color: white; box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); }
        .btn-hub:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(0, 210, 255, 0.4); }
    </style>
</head>
<body>

<header>
    <div class="system-status">VS Impossible AI</div>
    <h1>Tic Tac Toe</h1>
</header>

<div class="board-container">
    <div class="board" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>
</div>

<div class="controls">
    <button class="btn-restart" onclick="resetGame()">Restart</button>
    <button class="btn-hub" onclick="location.href='index.html'">Exit to Hub</button>
</div>

<div class="overlay" id="overlay">
    <div class="modal">
        <h2 id="winner-text">You Lose!</h2>
        <button class="btn-hub" onclick="resetGame()">Play Again</button>
    </div>
</div>

<script>
    if(localStorage.getItem("loggedIn") !== "true") window.location.replace("login.html");

    let board = ["", "", "", "", "", "", "", "", ""];
    let gameActive = true;
    const player = "X";
    const ai = "O";

    const winConditions = [ [0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6] ];

    function makeMove(index) {
        if (board[index] === "" && gameActive) {
            board[index] = player;
            updateUI();
            if (!checkWin(player) && !checkTie()) {
                setTimeout(aiMove, 300); // Small delay feels more natural
            }
        }
    }

    // IMPOSSIBLE AI (Minimax Algorithm)
    function aiMove() {
        let bestScore = -Infinity;
        let move;
        for (let i = 0; i < board.length; i++) {
            if (board[i] === "") {
                board[i] = ai;
                let score = minimax(board, 0, false);
                board[i] = "";
                if (score > bestScore) { bestScore = score; move = i; }
            }
        }
        board[move] = ai;
        updateUI();
        checkWin(ai);
        checkTie();
    }

    function minimax(board, depth, isMaximizing) {
        if (checkWinnerForMinimax(ai)) return 10 - depth;
        if (checkWinnerForMinimax(player)) return depth - 10;
        if (!board.includes("")) return 0;

        if (isMaximizing) {
            let bestScore = -Infinity;
            for (let i = 0; i < board.length; i++) {
                if (board[i] === "") {
                    board[i] = ai;
                    let score = minimax(board, depth + 1, false);
                    board[i] = "";
                    bestScore = Math.max(score, bestScore);
                }
            }
            return bestScore;
        } else {
            let bestScore = Infinity;
            for (let i = 0; i < board.length; i++) {
                if (board[i] === "") {
                    board[i] = player;
                    let score = minimax(board, depth + 1, true);
                    board[i] = "";
                    bestScore = Math.min(score, bestScore);
                }
            }
            return bestScore;
        }
    }

    function checkWinnerForMinimax(mark) {
        return winConditions.some(condition => {
            return condition.every(index => board[index] === mark);
        });
    }

    function updateUI() {
        const cells = document.querySelectorAll('.cell');
        board.forEach((mark, i) => {
            cells[i].innerText = mark;
            cells[i].className = "cell"; // Reset classes
            if (mark === "X") cells[i].classList.add("x-mark");
            if (mark === "O") cells[i].classList.add("o-mark");
        });
    }

    function checkWin(mark) {
        const hasWon = checkWinnerForMinimax(mark);
        if (hasWon) endGame(mark === player ? "You Win!" : "AI Wins!");
        return hasWon;
    }

    function checkTie() {
        if (!board.includes("") && gameActive) {
            endGame("It's a Draw!");
            return true;
        }
        return false;
    }

    function endGame(message) {
        gameActive = false;
        document.getElementById("winner-text").innerText = message;
        document.getElementById("overlay").style.display = "flex";
    }

    function resetGame() {
        board = ["", "", "", "", "", "", "", "", ""];
        gameActive = true;
        document.getElementById("overlay").style.display = "none";
        updateUI();
    }
</script>

</body>
</html>
