<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pratham Chess</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .status { margin-bottom: 15px; font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 40px);
    grid-template-rows: repeat(8, 40px);
    border: 8px solid #334155;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  @media (min-width: 600px) {
    .board { grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); }
  }
  .square {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 35px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  /* Updated Colors for better visibility */
  .white-sq { background-color: #e2e8f0; }
  .black-sq { background-color: #475569; }
  
  /* Piece colors */
  .p-white { color: #ffffff; text-shadow: 0 0 3px #000; } /* White pieces with outline */
  .p-black { color: #000000; } /* Black pieces */

  .selected { background-color: #fbbf24 !important; }
  .home-btn {
    margin-top: 20px;
    padding: 10px 25px;
    background: #38bdf8;
    border: none;
    border-radius: 8px;
    color: #020617;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="status" id="status">White's Turn</div>
<div class="board" id="board"></div>
<button class="home-btn" onclick="location.href='index.html'">⬅ Home</button>

<script>
// Check login status (Security check)
if(localStorage.getItem("loggedIn") !== "true") window.location.replace("login.html");

const boardElement = document.getElementById('board');
const statusElement = document.getElementById('status');

const pieces = {
  r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟',
  R: '♜', N: '♞', B: '♝', Q: '♛', K: '♚', P: '♟'
};

let board = [
  ['r','n','b','q','k','b','n','r'],
  ['p','p','p','p','p','p','p','p'],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['P','P','P','P','P','P','P','P'],
  ['R','N','B','Q','K','B','N','R']
];

let selectedSquare = null;
let turn = 'white';

function createBoard() {
  boardElement.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const square = document.createElement('div');
      square.classList.add('square');
      square.classList.add((r + c) % 2 === 0 ? 'white-sq' : 'black-sq');
      
      const piece = board[r][c];
      if (piece) {
        square.innerText = pieces[piece];
        // Apply color based on case (Upper = White, Lower = Black)
        square.classList.add(piece === piece.toUpperCase() ? 'p-white' : 'p-black');
      }

      square.onclick = () => handleSquareClick(r, c);
      boardElement.appendChild(square);
    }
  }
}

function handleSquareClick(r, c) {
  const piece = board[r][c];
  const isWhitePiece = piece && piece === piece.toUpperCase();
  const isBlackPiece = piece && piece === piece.toLowerCase();

  // 1. SELECTING A PIECE
  if (selectedSquare === null) {
    if ((turn === 'white' && isWhitePiece) || (turn === 'black' && isBlackPiece)) {
      selectedSquare = { r, c };
      refreshBoardWithSelection(r, c);
    }
  } 
  // 2. MOVING OR DESELECTING
  else {
    const sr = selectedSquare.r;
    const sc = selectedSquare.c;

    // Deselect if clicking the same square
    if (sr === r && sc === c) {
      selectedSquare = null;
      createBoard();
      return;
    }

    // BLOCK CAPTURING OWN PIECES
    const targetPiece = board[r][c];
    const isTargetSameTeam = targetPiece && (
      (turn === 'white' && targetPiece === targetPiece.toUpperCase()) ||
      (turn === 'black' && targetPiece === targetPiece.toLowerCase())
    );

    if (isTargetSameTeam) {
      // Switch selection to the new piece of the same team
      selectedSquare = { r, c };
      refreshBoardWithSelection(r, c);
      return;
    }

    // PERFORM MOVE
    board[r][c] = board[sr][sc];
    board[sr][sc] = '';

    // Switch turn
    turn = turn === 'white' ? 'black' : 'white';
    statusElement.innerText = turn.charAt(0).toUpperCase() + turn.slice(1) + "'s Turn";
    selectedSquare = null;
    createBoard();
  }
}

function refreshBoardWithSelection(row, col) {
  createBoard();
  const index = row * 8 + col;
  boardElement.children[index].classList.add('selected');
}

createBoard();
</script>
</body>
</html>
