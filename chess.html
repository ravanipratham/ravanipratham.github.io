<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Chess | Pratham Apps</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23020617'/><path d='M35 25h20c15 0 20 10 20 17.5S70 60 55 60H45v15h-10V25zm10 25h10c5 0 10-2 10-7.5s-5-7.5-10-7.5H45v15z' fill='%2338bdf8'/></svg>">

    <style>
        :root {
            --sq-white: #ebecd0; 
            --sq-black: #779556;
            --accent: #38bdf8;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow-x: hidden;
            background: #2b2b2b; 
            font-family: 'Inter', system-ui, sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        header { padding: 10px; text-align: center; }
        .status { font-size: 1.2rem; font-weight: bold; color: white; letter-spacing: 1px; }

        /* PLAYER INFO & TIMERS */
        .player-info {
            width: 100%; max-width: 380px;
            display: flex; justify-content: space-between; align-items: center;
            margin: 8px 0; padding: 0 5px; box-sizing: border-box;
        }
        .player-name { font-weight: bold; color: #ddd; font-size: 1.1rem; }
        .timer {
            background: #1e1e1e; color: #aaa;
            padding: 6px 14px; border-radius: 6px;
            font-family: monospace; font-size: 1.3rem; font-weight: bold;
            transition: all 0.3s ease;
        }
        .active-timer {
            background: #fff; color: #000;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* BOARD */
        .board { 
            display: grid; 
            grid-template-columns: repeat(8, 11.5vw);
            grid-template-rows: repeat(8, 11.5vw);
            border: 2px solid #111; 
            max-width: 380px; max-height: 380px; 
            position: relative; 
            box-sizing: border-box;
        }
        @media (min-width: 600px) { .board { grid-template-columns: repeat(8, 48px); grid-template-rows: repeat(8, 48px); } }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
        .white-sq { background-color: var(--sq-white); }
        .black-sq { background-color: var(--sq-black); }

        .piece { width: 95%; height: 95%; z-index: 5; user-select: none; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }

        .selected { background-color: rgba(255, 255, 0, 0.5) !important; }
        .last-move { background-color: rgba(255, 255, 0, 0.3) !important; }
        .hint::after { content: ''; width: 25%; height: 25%; background: rgba(0,0,0,0.2); border-radius: 50%; position: absolute; }
        .check { background-color: rgba(239, 68, 68, 0.6) !important; }

        /* OVERLAYS */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 4px; text-align: center; }
        .overlay h2 { margin-bottom: 5px; }
        .overlay p { color: #aaa; margin-top: 0; margin-bottom: 20px; font-weight: bold; }
        .promo-btn { width: 50px; height: 50px; background: white; border: 1px solid #ccc; cursor: pointer; padding: 5px; margin: 5px; border-radius: 8px; }
        .promo-btn img { width: 100%; height: 100%; }
        
        .controls { display: flex; gap: 10px; margin-top: 20px; padding-bottom: 20px;}
        button { padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; }
        .undo-btn { background: #4b4b4b; color: white; }
        .hub-btn { background: #81b64c; color: white; } 
    </style>
</head>
<body>

<header>
    <div class="status" id="status">White's Turn</div>
</header>

<div class="player-info">
    <div class="player-name">Black</div>
    <div class="timer" id="black-timer">10:00</div>
</div>

<div id="board" class="board">
    <div id="game-over-overlay" class="overlay">
        <h2 id="win-message">Checkmate</h2>
        <p id="win-subtext">White Wins</p>
        <button class="hub-btn" onclick="location.reload()">Reset Match</button>
    </div>
    <div id="promo-overlay" class="overlay">
        <h3>Promote</h3>
        <div id="promo-choices" style="display:flex;"></div>
    </div>
</div>

<div class="player-info">
    <div class="player-name">White</div>
    <div class="timer active-timer" id="white-timer">10:00</div>
</div>

<div class="controls">
    <button class="undo-btn" onclick="undoMove()">Undo</button>
    <button class="hub-btn" onclick="location.href='index.html'">Hub</button>
</div>

<script>
if(localStorage.getItem("loggedIn") !== "true") window.location.replace("login.html");

const boardElement = document.getElementById('board');
const statusElement = document.getElementById('status');
const overlay = document.getElementById('game-over-overlay');
const promoOverlay = document.getElementById('promo-overlay');
const promoChoices = document.getElementById('promo-choices');
const winMsg = document.getElementById('win-message');
const winSubtext = document.getElementById('win-subtext');

const moveSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
const captureSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3');

const imgUrls = {
    P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
    R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
    N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
    B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
    Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
    K: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
    p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
    r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
    n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
    b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
    q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
    k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
};

let board = [['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];
let turn = 'white', selectedSquare = null, enPassantTarget = null, history = [], lastMove = null;
let moveFlags = { whiteKing: false, blackKing: false, whiteRookA: false, whiteRookH: false, blackRookA: false, blackRookH: false };

// TIMER LOGIC
let whiteTime = 600; // 10 minutes in seconds
let blackTime = 600;
let timerInterval = null;
let gameActive = true;

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function updateTimerDisplay() {
    document.getElementById('white-timer').innerText = formatTime(whiteTime);
    document.getElementById('black-timer').innerText = formatTime(blackTime);
    
    if(turn === 'white') {
        document.getElementById('white-timer').classList.add('active-timer');
        document.getElementById('black-timer').classList.remove('active-timer');
    } else {
        document.getElementById('black-timer').classList.add('active-timer');
        document.getElementById('white-timer').classList.remove('active-timer');
    }
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (!gameActive) return;
        
        if (turn === 'white') whiteTime--;
        else blackTime--;
        
        updateTimerDisplay();

        if (whiteTime <= 0 || blackTime <= 0) {
            gameActive = false;
            clearInterval(timerInterval);
            overlay.style.display = 'flex';
            winMsg.innerText = "Timeout!";
            winSubtext.innerText = whiteTime <= 0 ? "Black Wins on Time" : "White Wins on Time";
        }
    }, 1000);
}

function createBoard() {
    boardElement.querySelectorAll('.square').forEach(s => s.remove());
    const isCheck = isKingInCheck(turn, board);
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const sq = document.createElement('div');
            sq.className = `square ${(r + c) % 2 === 0 ? 'white-sq' : 'black-sq'}`;
            const p = board[r][c];
            if(lastMove && ((lastMove.sr === r && lastMove.sc === c) || (lastMove.dr === r && lastMove.dc === c))) { sq.classList.add('last-move'); }
            if (p) {
                const img = document.createElement('img');
                img.src = imgUrls[p];
                img.className = 'piece';
                sq.appendChild(img);
                if(p.toLowerCase()==='k' && ((turn==='white' && p==='K') || (turn==='black' && p==='k')) && isCheck) sq.classList.add('check');
            }
            sq.onclick = () => handleSquareClick(r, c);
            boardElement.appendChild(sq);
        }
    }
}

function handleSquareClick(r, c) {
    if(!gameActive) return;
    const p = board[r][c];
    const isTeam = p && (turn === 'white' ? p === p.toUpperCase() : p === p.toLowerCase());

    if (selectedSquare === null) { 
        if (isTeam) { selectedSquare = {r, c}; createBoard(); document.querySelectorAll('.square')[r*8+c].classList.add('selected'); showHints(r, c); } 
    } else {
        const sr = selectedSquare.r, sc = selectedSquare.c, movingPiece = board[sr][sc];
        
        // Deselect if clicked the same piece again
        if (sr === r && sc === c) {
            selectedSquare = null;
            createBoard();
            return;
        }
        
        // Switch selection to another friendly piece
        if (isTeam) { 
            selectedSquare = {r, c}; 
            createBoard(); 
            document.querySelectorAll('.square')[r*8+c].classList.add('selected'); 
            showHints(r, c);
            return; 
        }

        // Try to move
        if (isValidMove(sr, sc, r, c, movingPiece, p, board)) { 
            executeMove(sr, sc, r, c, movingPiece); 
        } else { 
            selectedSquare = null; 
            createBoard(); 
        }
    }
}

function executeMove(sr, sc, dr, dc, p) {
    saveHistory();
    const pType = p.toLowerCase();
    let captured = board[dr][dc] !== '';
    if (pType === 'p' && Math.abs(dc - sc) === 1 && board[dr][dc] === '') { board[sr][dc] = ''; captured = true; }
    if (pType === 'k' && Math.abs(dc - sc) === 2) {
        if (dc === 6) { board[sr][5] = board[sr][7]; board[sr][7] = ''; }
        if (dc === 2) { board[sr][3] = board[sr][0]; board[sr][0] = ''; }
    }
    captured ? captureSfx.play().catch(e=>console.log(e)) : moveSfx.play().catch(e=>console.log(e));
    board[dr][dc] = p; board[sr][sc] = '';
    lastMove = {sr, sc, dr, dc};
    if (pType === 'p' && (dr === 0 || dr === 7)) { showPromotion(dr, dc, p === p.toUpperCase()); return; }
    finalizeTurn(sr, sc, dr, dc, p);
}

function showHints(r, c) {
    const sqs = document.querySelectorAll('.square');
    for(let tr=0; tr<8; tr++) for(let tc=0; tc<8; tc++) { if(isValidMove(r, c, tr, tc, board[r][c], board[tr][tc], board)) sqs[tr*8+tc].classList.add('hint'); }
}

function finalizeTurn(sr, sc, dr, dc, p) {
    enPassantTarget = (p.toLowerCase() === 'p' && Math.abs(dr - sr) === 2) ? { r: (sr + dr) / 2, c: dc } : null;
    if (p === 'K') moveFlags.whiteKing = true; if (p === 'k') moveFlags.blackKing = true;
    if (p === 'R' && sr === 7 && sc === 0) moveFlags.whiteRookA = true;
    if (p === 'R' && sr === 7 && sc === 7) moveFlags.whiteRookH = true;
    if (p === 'r' && sr === 0 && sc === 0) moveFlags.blackRookA = true;
    if (p === 'r' && sr === 0 && sc === 7) moveFlags.blackRookH = true;
    turn = turn === 'white' ? 'black' : 'white';
    statusElement.innerText = turn.charAt(0).toUpperCase() + turn.slice(1) + "'s Turn";
    
    updateTimerDisplay();

    if (isGameOver()) { 
        gameActive = false;
        clearInterval(timerInterval);
        overlay.style.display = 'flex'; 
        winMsg.innerText = isKingInCheck(turn, board) ? "Checkmate" : "Stalemate"; 
        winSubtext.innerText = isKingInCheck(turn, board) ? (turn === 'white' ? "Black Wins" : "White Wins") : "It's a draw";
    }
    selectedSquare = null; createBoard();
}

function showPromotion(r, c, isWhite) {
    promoOverlay.style.display = 'flex';
    promoChoices.innerHTML = '';
    const opts = isWhite ? ['Q', 'R', 'B', 'N'] : ['q', 'r', 'b', 'n'];
    opts.forEach(o => {
        const btn = document.createElement('div');
        btn.className = 'promo-btn';
        const img = document.createElement('img');
        img.src = imgUrls[o];
        btn.appendChild(img);
        btn.onclick = () => { board[r][c] = o; promoOverlay.style.display = 'none'; finalizeTurn(0,0,r,c,o); };
        promoChoices.appendChild(btn);
    });
}

function isKingInCheck(color, b) {
    let kPos = null; const king = color === 'white' ? 'K' : 'k';
    for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(b[r][c] === king) kPos = {r,c};
    if(!kPos) return false;
    for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
        const p = b[r][c];
        if(p !== '' && (color === 'white' ? p === p.toLowerCase() : p === p.toUpperCase())) {
            if(canAttack(r, c, kPos.r, kPos.c, p, b)) return true;
        }
    }
    return false;
}

function canAttack(sr, sc, dr, dc, p, b) {
    const absR = Math.abs(dr - sr), absC = Math.abs(dc - sc), pType = p.toLowerCase(), isWhite = p === p.toUpperCase();
    if (pType === 'p') return absC === 1 && dr === sr + (isWhite ? -1 : 1);
    if (pType === 'n') return (absR === 2 && absC === 1) || (absR === 1 && absC === 2);
    if (pType === 'r') return (sr === dr || sc === dc) && isPathClear(sr, sc, dr, dc, b);
    if (pType === 'b') return (absR === absC) && isPathClear(sr, sc, dr, dc, b);
    if (pType === 'q') return ((sr === dr || sc === dc) || (absR === absC)) && isPathClear(sr, sc, dr, dc, b);
    if (pType === 'k') return (absR <= 1 && absC <= 1);
    return false;
}

function isPathClear(sr, sc, dr, dc, b) {
    let rStep = dr === sr ? 0 : (dr > sr ? 1 : -1), cStep = dc === sc ? 0 : (dc > sc ? 1 : -1);
    let currR = sr + rStep, currC = sc + cStep;
    while (currR !== dr || currC !== dc) {
        if (b[currR][currC] !== '') return false; currR += rStep; currC += cStep;
    }
    return true;
}

function isValidMove(sr, sc, dr, dc, piece, target, b) {
    const isWhite = piece === piece.toUpperCase();
    const pType = piece.toLowerCase(), absR = Math.abs(dr - sr), absC = Math.abs(dc - sc);
    if (target !== '' && isWhite === (target === target.toUpperCase())) return false;
    let valid = false;
    if (pType === 'p') {
        const dir = isWhite ? -1 : 1;
        if (sc === dc && dr === sr + dir && target === '') valid = true;
        else if (sc === dc && sr === (isWhite?6:1) && dr === sr + 2*dir && target === '' && b[sr+dir][sc] === '') valid = true;
        else if (absC === 1 && dr === sr + dir && (target !== '' || (enPassantTarget && enPassantTarget.r === dr && enPassantTarget.c === dc))) valid = true;
    } else if (pType === 'n') valid = (absR === 2 && absC === 1) || (absR === 1 && absC === 2);
    else if (pType === 'r') valid = (sr === dr || sc === dc) && isPathClear(sr, sc, dr, dc, b);
    else if (pType === 'b') valid = (absR === absC) && isPathClear(sr, sc, dr, dc, b);
    else if (pType === 'q') valid = ((sr === dr || sc === dc) || (absR === absC)) && isPathClear(sr, sc, dr, dc, b);
    else if (pType === 'k') {
        if (absR <= 1 && absC <= 1) valid = true;
        else if (absR === 0 && absC === 2 && !isKingInCheck(isWhite?'white':'black', b)) {
            if (isWhite && !moveFlags.whiteKing) {
                if (dc === 6 && !moveFlags.whiteRookH && isPathClear(sr, 4, sr, 7, b)) valid = true;
                if (dc === 2 && !moveFlags.whiteRookA && isPathClear(sr, 4, sr, 0, b)) valid = true;
            } else if (!isWhite && !moveFlags.blackKing) {
                if (dc === 6 && !moveFlags.blackRookH && isPathClear(sr, 4, sr, 7, b)) valid = true;
                if (dc === 2 && !moveFlags.blackRookA && isPathClear(sr, 4, sr, 0, b)) valid = true;
            }
        }
    }
    if (!valid) return false;
    const nextB = JSON.parse(JSON.stringify(b));
    nextB[dr][dc] = nextB[sr][sc]; nextB[sr][sc] = '';
    if (pType === 'p' && absC === 1 && target === '') nextB[sr][dc] = '';
    return !isKingInCheck(isWhite ? 'white' : 'black', nextB);
}

function isGameOver() {
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const p = board[r][c];
        if (p && (turn === 'white' ? p === p.toUpperCase() : p === p.toLowerCase())) {
            for (let tr = 0; tr < 8; tr++) for (let tc = 0; tc < 8; tc++) if (isValidMove(r, c, tr, tc, p, board[tr][tc], board)) return false;
        }
    }
    return true;
}

// Ensure the time state is saved so if you "Undo", the clock goes back to what it was!
function saveHistory() { 
    history.push({ board: JSON.parse(JSON.stringify(board)), turn, moveFlags: JSON.parse(JSON.stringify(moveFlags)), enPassantTarget, lastMove, wTime: whiteTime, bTime: blackTime }); 
}

function undoMove() { 
    if (history.length === 0 || !gameActive) return; 
    const last = history.pop(); 
    board = last.board; turn = last.turn; moveFlags = last.moveFlags; enPassantTarget = last.enPassantTarget; lastMove = last.lastMove; 
    whiteTime = last.wTime; blackTime = last.bTime;
    statusElement.innerText = turn.charAt(0).toUpperCase() + turn.slice(1) + "'s Turn"; 
    updateTimerDisplay();
    selectedSquare = null; 
    createBoard(); 
}

createBoard();
startTimer(); // Starts the clock immediately
</script>
</body>
</html>
