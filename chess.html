<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pratham Chess</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .status { 
    margin-bottom: 15px; 
    font-size: 1.5rem; 
    font-weight: bold; 
    color: #38bdf8;
    text-shadow: 0 0 10px rgba(56,189,248,0.3);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 40px);
    grid-template-rows: repeat(8, 40px);
    border: 8px solid #334155;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  @media (min-width: 600px) {
    .board { grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); }
  }
  .square {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
  }
  .white-sq { background-color: #e2e8f0; }
  .black-sq { background-color: #475569; }
  
  /* Team Colors */
  .p-white { color: #ffffff; text-shadow: 0 0 4px #000; } 
  .p-black { color: #000000; }

  .selected { background-color: #fbbf24 !important; }
  .home-btn {
    margin-top: 25px;
    padding: 12px 30px;
    background: #38bdf8;
    border: none;
    border-radius: 10px;
    color: #020617;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .home-btn:hover { transform: scale(1.05); background: #7dd3fc; }
</style>
</head>
<body>

<div class="status" id="status">White's Turn</div>
<div id="board" class="board"></div>
<button class="home-btn" onclick="location.href='index.html'">⬅ Home</button>

<script>
/* 1. SECURITY CHECK */
if(localStorage.getItem("loggedIn") !== "true") window.location.replace("login.html");

const boardElement = document.getElementById('board');
const statusElement = document.getElementById('status');

const pieces = {
  r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟',
  R: '♜', N: '♞', B: '♝', Q: '♛', K: '♚', P: '♟'
};

let board = [
  ['r','n','b','q','k','b','n','r'],
  ['p','p','p','p','p','p','p','p'],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['P','P','P','P','P','P','P','P'],
  ['R','N','B','Q','K','B','N','R']
];

let selectedSquare = null;
let turn = 'white';

function createBoard() {
  boardElement.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const square = document.createElement('div');
      square.classList.add('square');
      square.classList.add((r + c) % 2 === 0 ? 'white-sq' : 'black-sq');
      
      const piece = board[r][c];
      if (piece) {
        square.innerText = pieces[piece];
        square.classList.add(piece === piece.toUpperCase() ? 'p-white' : 'p-black');
      }

      square.onclick = () => handleSquareClick(r, c);
      boardElement.appendChild(square);
    }
  }
}

/* 2. MOVE VALIDATION RULES */
function isValidMove(sr, sc, dr, dc, piece, target) {
  const isWhite = piece === piece.toUpperCase();
  const diffR = dr - sr;
  const diffC = dc - sc;
  const absR = Math.abs(diffR);
  const absC = Math.abs(diffC);

  // PAWN LOGIC
  if (piece.toLowerCase() === 'p') {
    const direction = isWhite ? -1 : 1;
    const startRow = isWhite ? 6 : 1;

    // Forward 1
    if (diffC === 0 && diffR === direction && target === '') return true;
    // Forward 2
    if (diffC === 0 && sr === startRow && diffR === 2 * direction && target === '' && board[sr + direction][sc] === '') return true;
    // Capture
    if (absC === 1 && diffR === direction && target !== '') return true;
    return false;
  }

  // KNIGHT LOGIC (L-Shape)
  if (piece.toLowerCase() === 'n') {
    return (absR === 2 && absC === 1) || (absR === 1 && absC === 2);
  }

  // Default: allow other pieces to move anywhere (for now) as long as not on own team
  return true; 
}

/* 3. CLICK HANDLING */
function handleSquareClick(r, c) {
  const piece = board[r][c];
  const isWhitePiece = piece && piece === piece.toUpperCase();
  const isBlackPiece = piece && piece === piece.toLowerCase();

  if (selectedSquare === null) {
    if ((turn === 'white' && isWhitePiece) || (turn === 'black' && isBlackPiece)) {
      selectedSquare = { r, c };
      refreshBoardWithSelection(r, c);
    }
  } else {
    const sr = selectedSquare.r;
    const sc = selectedSquare.c;
    const movingPiece = board[sr][sc];

    if (sr === r && sc === c) {
      selectedSquare = null;
      createBoard();
      return;
    }

    const targetPiece = board[r][c];
    const isTargetSameTeam = targetPiece && (
      (turn === 'white' && targetPiece === targetPiece.toUpperCase()) ||
      (turn === 'black' && targetPiece === targetPiece.toLowerCase())
    );

    if (isTargetSameTeam) {
      selectedSquare = { r, c };
      refreshBoardWithSelection(r, c);
      return;
    }

    // CHECK RULES
    if (isValidMove(sr, sc, r, c, movingPiece, targetPiece)) {
      board[r][c] = movingPiece;
      board[sr][sc] = '';
      turn = turn === 'white' ? 'black' : 'white';
      statusElement.innerText = turn.charAt(0).toUpperCase() + turn.slice(1) + "'s Turn";
      selectedSquare = null;
      createBoard();
    }
  }
}

function refreshBoardWithSelection(row, col) {
  createBoard();
  const index = row * 8 + col;
  boardElement.children[index].classList.add('selected');
}

createBoard();
</script>
</body>
</html>
