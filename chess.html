<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pratham Chess</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .status { 
    margin-bottom: 15px; 
    font-size: 1.5rem; 
    font-weight: bold; 
    color: #38bdf8;
    text-shadow: 0 0 10px rgba(56,189,248,0.3);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 40px);
    grid-template-rows: repeat(8, 40px);
    border: 8px solid #334155;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  @media (min-width: 600px) {
    .board { grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); }
  }
  .square {
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    font-size: 38px; cursor: pointer; user-select: none;
    transition: all 0.2s;
  }
  .white-sq { background-color: #e2e8f0; }
  .black-sq { background-color: #475569; }
  .p-white { color: #ffffff; text-shadow: 0 0 4px #000; } 
  .p-black { color: #000000; }
  .selected { background-color: #fbbf24 !important; }
  .home-btn {
    margin-top: 25px; padding: 12px 30px;
    background: #38bdf8; border: none; border-radius: 10px;
    color: #020617; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>

<div class="status" id="status">White's Turn</div>
<div id="board" class="board"></div>
<button class="home-btn" onclick="location.href='index.html'">⬅ Home</button>

<script>
if(localStorage.getItem("loggedIn") !== "true") window.location.replace("login.html");

const boardElement = document.getElementById('board');
const statusElement = document.getElementById('status');
const pieces = { r:'♜', n:'♞', b:'♝', q:'♛', k:'♚', p:'♟', R:'♜', N:'♞', B:'♝', Q:'♛', K:'♚', P:'♟' };

let board = [
  ['r','n','b','q','k','b','n','r'],
  ['p','p','p','p','p','p','p','p'],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['P','P','P','P','P','P','P','P'],
  ['R','N','B','Q','K','B','N','R']
];

let selectedSquare = null;
let turn = 'white';

function createBoard() {
  boardElement.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const square = document.createElement('div');
      square.className = `square ${(r + c) % 2 === 0 ? 'white-sq' : 'black-sq'}`;
      const piece = board[r][c];
      if (piece) {
        square.innerText = pieces[piece];
        square.classList.add(piece === piece.toUpperCase() ? 'p-white' : 'p-black');
      }
      square.onclick = () => handleSquareClick(r, c);
      boardElement.appendChild(square);
    }
  }
}

// HELPER: Check if path is clear for sliding pieces (Rook/Bishop)
function isPathClear(sr, sc, dr, dc) {
  let rStep = dr > sr ? 1 : (dr < sr ? -1 : 0);
  let cStep = dc > sc ? 1 : (dc < sc ? -1 : 0);
  let currR = sr + rStep;
  let currC = sc + cStep;
  while (currR !== dr || currC !== dc) {
    if (board[currR][currC] !== '') return false;
    currR += rStep;
    currC += cStep;
  }
  return true;
}

function isValidMove(sr, sc, dr, dc, piece, target) {
  const isWhite = piece === piece.toUpperCase();
  const absR = Math.abs(dr - sr);
  const absC = Math.abs(dc - sc);

  // PAWN
  if (piece.toLowerCase() === 'p') {
    const dir = isWhite ? -1 : 1;
    if (sc === dc && dr === sr + dir && target === '') return true;
    if (sc === dc && sr === (isWhite?6:1) && dr === sr + 2*dir && target === '' && board[sr+dir][sc] === '') return true;
    if (absC === 1 && dr === sr + dir && target !== '') return true;
    return false;
  }

  // KNIGHT
  if (piece.toLowerCase() === 'n') return (absR === 2 && absC === 1) || (absR === 1 && absC === 2);

  // ROOK (Straight lines)
  if (piece.toLowerCase() === 'r') {
    if (sr === dr || sc === dc) return isPathClear(sr, sc, dr, dc);
    return false;
  }

  // BISHOP (Diagonals)
  if (piece.toLowerCase() === 'b') {
    if (absR === absC) return isPathClear(sr, sc, dr, dc);
    return false;
  }

  return true; // Queen/King remain flexible for now
}

function handleSquareClick(r, c) {
  const piece = board[r][c];
  const isTeam = piece && (turn === 'white' ? piece === piece.toUpperCase() : piece === piece.toLowerCase());

  if (selectedSquare === null) {
    if (isTeam) {
      selectedSquare = { r, c };
      refreshBoardWithSelection(r, c);
    }
  } else {
    const sr = selectedSquare.r, sc = selectedSquare.c;
    const movingPiece = board[sr][sc];
    
    if (isTeam) { // Switch selection
      selectedSquare = { r, c };
      refreshBoardWithSelection(r, c);
      return;
    }

    if (isValidMove(sr, sc, r, c, movingPiece, board[r][c])) {
      board[r][c] = movingPiece;
      board[sr][sc] = '';
      turn = turn === 'white' ? 'black' : 'white';
      statusElement.innerText = turn.charAt(0).toUpperCase() + turn.slice(1) + "'s Turn";
      selectedSquare = null;
      createBoard();
    }
  }
}

function refreshBoardWithSelection(row, col) {
  createBoard();
  boardElement.children[row * 8 + col].classList.add('selected');
}

createBoard();
</script>
</body>
</html>
