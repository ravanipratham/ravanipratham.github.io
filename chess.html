<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Chess | Pratham Apps</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23020617'/><path d='M35 25h20c15 0 20 10 20 17.5S70 60 55 60H45v15h-10V25zm10 25h10c5 0 10-2 10-7.5s-5-7.5-10-7.5H45v15z' fill='%2338bdf8'/></svg>">
    <style>
        :root {
            --sq-white: rgba(226, 232, 240, 0.05);
            --sq-black: rgba(15, 23, 42, 0.6);
            --accent: #38bdf8;
            --white-p: #ffffff;
            --black-p: #0ea5e9;
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #020617; 
            background: radial-gradient(circle at top right, #1e1b4b, #020617);
            font-family: 'Inter', system-ui, sans-serif; color: white;
            display: flex; flex-direction: column; align-items: center;
            touch-action: manipulation;
        }

        header { text-align: center; padding: 15px; display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 30px; height: 30px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #020617; font-size: 16px; }
        .status { font-size: 1rem; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }

        .board { 
            display: grid; grid-template-columns: repeat(8, 11.5vw); grid-template-rows: repeat(8, 11.5vw); 
            border: 2px solid rgba(56, 189, 248, 0.2); 
            max-width: 380px; max-height: 380px; position: relative; 
            background: rgba(255,255,255,0.01); backdrop-filter: blur(10px);
        }
        @media (min-width: 600px) { .board { grid-template-columns: repeat(8, 45px); grid-template-rows: repeat(8, 45px); } }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .white-sq { background-color: var(--sq-white); }
        .black-sq { background-color: var(--sq-black); }

        /* Piece SVGs */
        .piece { width: 80%; height: 80%; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 5; }
        .p-white { fill: var(--white-p); filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
        .p-black { fill: #000; stroke: var(--black-p); stroke-width: 20px; filter: drop-shadow(0 0 8px rgba(14, 165, 233, 0.6)); }

        .selected { background: rgba(56, 189, 248, 0.25) !important; box-shadow: inset 0 0 15px var(--accent); }
        .hint::after { content: ''; width: 20%; height: 20%; background: var(--accent); border-radius: 50%; opacity: 0.5; box-shadow: 0 0 10px var(--accent); }
        
        /* Trail Effect */
        .last-move { background: rgba(56, 189, 248, 0.1) !important; border: 1px solid rgba(56, 189, 248, 0.2); }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(12px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border: 1px solid var(--accent); border-radius: 4px; }
        .promo-options { display: flex; gap: 10px; margin-top: 20px; }
        .promo-btn { width: 55px; height: 55px; background: rgba(255,255,255,0.05); border: 1px solid var(--accent); border-radius: 12px; cursor: pointer; padding: 8px; display: flex; align-items: center; }

        .controls { display: flex; gap: 15px; margin-top: 25px; }
        button { padding: 12px 24px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .primary-btn { background: var(--accent); color: #020617; border: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>

<header>
    <div class="brand-logo">P</div>
    <div class="status" id="status">White's Turn</div>
</header>

<div id="board" class="board">
    <div id="game-over-overlay" class="overlay">
        <h2 id="win-message" style="color:var(--accent)">Checkmate</h2>
        <button class="primary-btn" onclick="location.reload()">Reset Match</button>
    </div>
    <div id="promo-overlay" class="overlay">
        <h3 style="color:var(--accent)">Promotion</h3>
        <div class="promo-options" id="promo-choices"></div>
    </div>
</div>

<div class="controls">
    <button onclick="undoMove()">Undo</button>
    <button class="primary-btn" onclick="location.href='index.html'">Hub</button>
</div>

<script>
const svgs = {
    P: `<svg viewBox="0 0 320 512" class="piece p-white"><path d="M160 32a64 64 0 1 0 0 128 64 64 0 1 0 0-128zM124.7 184.2C85.5 204.6 64 246.4 64 288c0 30.2 16.3 57.5 42.4 71.3l-22 66.1C75 453.7 96.1 480 125.7 480h68.6c29.7 0 50.7-26.3 41.3-54.6l-22-66.1c26.1-13.8 42.4-41.1 42.4-71.3 0-41.6-21.5-83.4-60.7-103.8l-15.3-7.9c-12-6.2-26.1-6.2-38 0l-15.3 7.9z"/></svg>`,
    R: `<svg viewBox="0 0 448 512" class="piece p-white"><path d="M32 32C14.3 32 0 46.3 0 64s14.3 32 32 32h16v128H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h16v128H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h384c17.7 0 32-14.3 32-32s-14.3-32-32-32h-16V320h16c17.7 0 32-14.3 32-32s-14.3-32-32-32h-16V128h16c17.7 0 32-14.3 32-32s-14.3-32-32-32h-16V64c0-17.7-14.3-32-32-32H32z"/></svg>`,
    N: `<svg viewBox="0 0 448 512" class="piece p-white"><path d="M325.3 48c-4.9-2.3-10.4-3.5-16-3.5h-96c-17.7 0-32 14.3-32 32v128c0 10.6 5.3 20.4 14.2 26.2l128 84c4.1 2.7 6.6 7.2 6.6 12.1v91.3c0 23.3-17.7 42.7-41 43.9-25.2 1.3-46.7-17.4-46.7-42.6V352c0-17.7-14.3-32-32-32s-32 14.3-32 32v69.3c0 60.1 48.7 108.7 108.8 108.7h112c17.7 0 32-14.3 32-32V320c0-10.6-5.3-20.4-14.2-26.2l-128-84c-4.1-2.7-6.6-7.2-6.6-12.1V96c0-23.3 17.7-42.7 41-43.9 25.2-1.3 46.7 17.4 46.7 42.6V128c0 17.7 14.3 32 32 32s32-14.3 32-32V96c0-60.1-48.7-108.7-108.8-108.7h-1.3z"/></svg>`,
    B: `<svg viewBox="0 0 320 512" class="piece p-white"><path d="M160 0C115.8 0 80 35.8 80 80c0 23.7 10.3 45 26.7 59.7l-41.1 82.2C27 298.5 64 384 160 384s133-85.5 94.4-162.1l-41.1-82.2C229.7 125 240 103.7 240 80c0-44.2-35.8-80-80-80zM128 448h64c17.7 0 32 14.3 32 32s-14.3 32-32 32h-64c-17.7 0-32-14.3-32-32s14.3-32 32-32z"/></svg>`,
    Q: `<svg viewBox="0 0 512 512" class="piece p-white"><path d="M256 32c17.7 0 32 14.3 32 32s-14.3 32-32 32-32-14.3-32-32 14.3-32 32-32zm160 128c17.7 0 32 14.3 32 32s-14.3 32-32 32-32-14.3-32-32 14.3-32 32-32zM96 160c17.7 0 32 14.3 32 32s-14.3 32-32 32-32-14.3-32-32 14.3-32 32-32zm313.4 135.5l-65.7-13.1c-10.4-2.1-20.7 3.3-24.6 13.1l-63.1 157.7-63.1-157.7c-3.9-9.8-14.2-15.1-24.6-13.1l-65.7 13.1c-14.8 3-23.4 17.5-18.7 31.8l63 192c3.3 10.1 12.8 16.9 23.4 16.9h171.4c10.6 0 20.1-6.8 23.4-16.9l63-192c4.7-14.3-3.9-28.8-18.7-31.8z"/></svg>`,
    K: `<svg viewBox="0 0 448 512" class="piece p-white"><path d="M224 0c17.7 0 32 14.3 32 32v16h16c17.7 0 32 14.3 32 32s-14.3 32-32 32h-16v48h112c17.7 0 32 14.3 32 32s-14.3 32-32 32H320v48h16c17.7 0 32 14.3 32 32s-14.3 32-32 32h-16v32c0 17.7-14.3 32-32 32H128c-17.7 0-32-14.3-32-32v-32H80c-17.7 0-32-14.3-32-32s14.3-32 32-32h16v-48H32c-17.7 0-32-14.3-32-32s14.3-32 32-32h112v-48h-16c-17.7 0-32-14.3-32-32s14.3-32 32-32h16V32c0-17.7 14.3-32 32-32h32z"/></svg>`
};

const moveSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
const captureSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3');

let board = [
    ['r','n','b','q','k','b','n','r'],
    ['p','p','p','p','p','p','p','p'],
    ['','','','','','','',''],['','','','','','','',''],
    ['','','','','','','',''],['','','','','','','',''],
    ['P','P','P','P','P','P','P','P'],
    ['R','N','B','Q','K','B','N','R']
];

let turn = 'white', selectedSquare = null, enPassantTarget = null, history = [], lastMove = null;
let moveFlags = { whiteKing: false, blackKing: false, whiteRookA: false, whiteRookH: false, blackRookA: false, blackRookH: false };

function createBoard() {
    const boardEl = document.getElementById('board');
    boardEl.querySelectorAll('.square').forEach(s => s.remove());
    const isCheck = isKingInCheck(turn, board);

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const sq = document.createElement('div');
            sq.className = `square ${(r + c) % 2 === 0 ? 'white-sq' : 'black-sq'}`;
            const p = board[r][c];
            
            // Trail Logic
            if(lastMove && ((lastMove.sr === r && lastMove.sc === c) || (lastMove.dr === r && lastMove.dc === c))) {
                sq.classList.add('last-move');
            }

            if (p) {
                const isWhite = p === p.toUpperCase();
                let svgStr = svgs[p.toUpperCase()];
                if(!isWhite) svgStr = svgStr.replace('p-white', 'p-black');
                sq.innerHTML = svgStr;
                if(p.toLowerCase()==='k' && ((turn==='white' && p==='K') || (turn==='black' && p==='k')) && isCheck) sq.classList.add('check');
            }
            sq.onclick = () => handleSquareClick(r, c);
            boardEl.appendChild(sq);
        }
    }
}

function handleSquareClick(r, c) {
    const p = board[r][c];
    const isTeam = p && (turn === 'white' ? p === p.toUpperCase() : p === p.toLowerCase());

    if (selectedSquare === null) {
        if (isTeam) {
            selectedSquare = {r, c};
            createBoard();
            document.querySelectorAll('.square')[r*8+c].classList.add('selected');
            showHints(r, c);
        }
    } else {
        const {r: sr, c: sc} = selectedSquare;
        if (isTeam) {
            selectedSquare = {r, c};
            handleSquareClick(r, c);
            return;
        }
        if (isValidMove(sr, sc, r, c, board[sr][sc], p, board)) {
            executeMove(sr, sc, r, c, board[sr][sc]);
        } else {
            selectedSquare = null;
            createBoard();
        }
    }
}

function showHints(r, c) {
    const sqs = document.querySelectorAll('.square');
    for(let tr=0; tr<8; tr++) for(let tc=0; tc<8; tc++) {
        if(isValidMove(r, c, tr, tc, board[r][c], board[tr][tc], board)) sqs[tr*8+tc].classList.add('hint');
    }
}

function executeMove(sr, sc, dr, dc, p) {
    saveHistory();
    const isWhite = p === p.toUpperCase();
    const pType = p.toLowerCase();
    let captured = board[dr][dc] !== '';

    // En Passant Capture logic
    if (pType === 'p' && Math.abs(dc - sc) === 1 && board[dr][dc] === '') {
        board[sr][dc] = '';
        captured = true;
    }

    // Castling logic
    if (pType === 'k' && Math.abs(dc - sc) === 2) {
        if (dc === 6) { board[sr][5] = board[sr][7]; board[sr][7] = ''; }
        if (dc === 2) { board[sr][3] = board[sr][0]; board[sr][0] = ''; }
    }

    captured ? captureSfx.play() : moveSfx.play();
    board[dr][dc] = p; board[sr][sc] = '';
    lastMove = {sr, sc, dr, dc};

    // Promotion logic
    if (pType === 'p' && (dr === 0 || dr === 7)) {
        showPromotion(dr, dc, isWhite);
        return;
    }

    finalizeTurn(sr, sc, dr, dc, p);
}

function finalizeTurn(sr, sc, dr, dc, p) {
    enPassantTarget = (p.toLowerCase() === 'p' && Math.abs(dr - sr) === 2) ? { r: (sr + dr) / 2, c: dc } : null;
    if (p === 'K') moveFlags.whiteKing = true; if (p === 'k') moveFlags.blackKing = true;
    turn = turn === 'white' ? 'black' : 'white';
    document.getElementById('status').innerText = turn + "'s Turn";
    
    if (isGameOver()) {
        document.getElementById('game-over-overlay').style.display = 'flex';
        const check = isKingInCheck(turn, board);
        document.getElementById('win-message').innerText = check ? "Checkmate" : "Stalemate";
    }
    selectedSquare = null;
    createBoard();
}

function showPromotion(r, c, isWhite) {
    const overlay = document.getElementById('promo-overlay');
    const choices = document.getElementById('promo-choices');
    overlay.style.display = 'flex';
    choices.innerHTML = '';
    const opts = isWhite ? ['Q', 'R', 'B', 'N'] : ['q', 'r', 'b', 'n'];
    opts.forEach(o => {
        const btn = document.createElement('div');
        btn.className = 'promo-btn';
        let svg = svgs[o.toUpperCase()];
        if(!isWhite) svg = svg.replace('p-white', 'p-black');
        btn.innerHTML = svg;
        btn.onclick = () => {
            board[r][c] = o;
            overlay.style.display = 'none';
            finalizeTurn(0,0,r,c,o);
        };
        choices.appendChild(btn);
    });
}

function isKingInCheck(color, b) {
    let kPos = null;
    const king = color === 'white' ? 'K' : 'k';
    for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(b[r][c] === king) kPos = {r,c};
    if(!kPos) return false;
    for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
        const p = b[r][c];
        if(p !== '' && (color === 'white' ? p === p.toLowerCase() : p === p.toUpperCase())) {
            if(canAttack(r, c, kPos.r, kPos.c, p, b)) return true;
        }
    }
    return false;
}

function canAttack(sr, sc, dr, dc, p, b) {
    const absR = Math.abs(dr - sr), absC = Math.abs(dc - sc), pType = p.toLowerCase();
    const isWhite = p === p.toUpperCase();
    if (pType === 'p') return absC === 1 && dr === sr + (isWhite ? -1 : 1);
    if (pType === 'n') return (absR === 2 && absC === 1) || (absR === 1 && absC === 2);
    if (pType === 'r') return (sr === dr || sc === dc) && isPathClear(sr, sc, dr, dc, b);
    if (pType === 'b') return (absR === absC) && isPathClear(sr, sc, dr, dc, b);
    if (pType === 'q') return ((sr === dr || sc === dc) || (absR === absC)) && isPathClear(sr, sc, dr, dc, b);
    if (pType === 'k') return (absR <= 1 && absC <= 1);
    return false;
}

function isPathClear(sr, sc, dr, dc, b) {
    let rStep = dr === sr ? 0 : (dr > sr ? 1 : -1), cStep = dc === sc ? 0 : (dc > sc ? 1 : -1);
    let currR = sr + rStep, currC = sc + cStep;
    while (currR !== dr || currC !== dc) {
        if (b[currR][currC] !== '') return false;
        currR += rStep; currC += cStep;
    }
    return true;
}

function isValidMove(sr, sc, dr, dc, piece, target, b) {
    const isWhite = piece === piece.toUpperCase();
    const pType = piece.toLowerCase(), absR = Math.abs(dr - sr), absC = Math.abs(dc - sc);
    if (target !== '' && isWhite === (target === target.toUpperCase())) return false;
    let valid = false;
    if (pType === 'p') {
        const dir = isWhite ? -1 : 1;
        if (sc === dc && dr === sr + dir && target === '') valid = true;
        else if (sc === dc && sr === (isWhite?6:1) && dr === sr + 2*dir && target === '' && b[sr+dir][sc] === '') valid = true;
        else if (absC === 1 && dr === sr + dir && (target !== '' || (enPassantTarget && enPassantTarget.r === dr && enPassantTarget.c === dc))) valid = true;
    } else if (pType === 'n') valid = (absR === 2 && absC === 1) || (absR === 1 && absC === 2);
    else if (pType === 'r') valid = (sr === dr || sc === dc) && isPathClear(sr, sc, dr, dc, b);
    else if (pType === 'b') valid = (absR === absC) && isPathClear(sr, sc, dr, dc, b);
    else if (pType === 'q') valid = ((sr === dr || sc === dc) || (absR === absC)) && isPathClear(sr, sc, dr, dc, b);
    else if (pType === 'k') {
        if (absR <= 1 && absC <= 1) valid = true;
        else if (absR === 0 && absC === 2 && !isKingInCheck(isWhite?'white':'black', b)) {
            if (isWhite && !moveFlags.whiteKing) {
                if (dc === 6 && !moveFlags.whiteRookH && isPathClear(sr, 4, sr, 7, b)) valid = true;
                if (dc === 2 && !moveFlags.whiteRookA && isPathClear(sr, 4, sr, 0, b)) valid = true;
            } else if (!isWhite && !moveFlags.blackKing) {
                if (dc === 6 && !moveFlags.blackRookH && isPathClear(sr, 4, sr, 7, b)) valid = true;
                if (dc === 2 && !moveFlags.blackRookA && isPathClear(sr, 4, sr, 0, b)) valid = true;
            }
        }
    }
    if (!valid) return false;
    const nextB = JSON.parse(JSON.stringify(b));
    nextB[dr][dc] = nextB[sr][sc]; nextB[sr][sc] = '';
    if (pType === 'p' && absC === 1 && target === '') nextB[sr][dc] = '';
    return !isKingInCheck(isWhite ? 'white' : 'black', nextB);
}

function isGameOver() {
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const p = board[r][c];
        if (p && (turn === 'white' ? p === p.toUpperCase() : p === p.toLowerCase())) {
            for (let tr = 0; tr < 8; tr++) for (let tc = 0; tc < 8; tc++) if (isValidMove(r, c, tr, tc, p, board[tr][tc], board)) return false;
        }
    }
    return true;
}

function saveHistory() { history.push({ board: JSON.parse(JSON.stringify(board)), turn, moveFlags: JSON.parse(JSON.stringify(moveFlags)), enPassantTarget, lastMove }); }
function undoMove() { if (history.length === 0) return; const last = history.pop(); board = last.board; turn = last.turn; moveFlags = last.moveFlags; enPassantTarget = last.enPassantTarget; lastMove = last.lastMove; createBoard(); }

createBoard();
</script>
</body>
</html>
