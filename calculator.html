<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pratham Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0;
    background: #020617;
    background: radial-gradient(circle at bottom left, #1e1b4b, #020617);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .calculator {
    width: 340px;
    padding: 25px;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 35px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5);
  }

  .display {
    color: white;
    font-size: 54px;
    text-align: right;
    padding: 40px 10px 20px;
    height: 80px;
    overflow: hidden;
    font-weight: 300;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
  }

  button {
    height: 65px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 24px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.08);
    color: white;
    transition: all 0.2s;
  }

  button:hover { background: rgba(255, 255, 255, 0.15); }
  button:active { transform: scale(0.92); }

  button.operator { background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-weight: bold; }
  button.equal { background: #2563eb; color: white; box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); }
  button.gray { background: rgba(255, 255, 255, 0.05); color: #94a3b8; }

  .zero { grid-column: span 2; }

  .home-btn {
    width: 100%;
    margin-bottom: 20px;
    height: 45px;
    border-radius: 12px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="calculator">
  <button class="home-btn" onclick="location.href='index.html'">⬅ Back to Hub</button>
  <div id="display" class="display">0</div>
  <div class="buttons">
    <button class="gray" onclick="clearAll()">AC</button>
    <button class="gray" onclick="backspace()">⌫</button>
    <button class="operator" onclick="append('/')">÷</button>
    <button class="operator" onclick="append('*')">×</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('-')">−</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="equal" onclick="calculate()">=</button>

    <button class="zero" onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
  </div>
</div>

<script>
let display = document.getElementById("display");

function append(value) {
  if (display.innerText === "0" && value !== ".") {
    display.innerText = value;
  } else {
    display.innerText += value;
  }
}

function clearAll() { display.innerText = "0"; }

function backspace() {
  display.innerText = display.innerText.length > 1 ? display.innerText.slice(0, -1) : "0";
}

function calculate() {
  try {
    display.innerText = eval(display.innerText.replace('×', '*').replace('÷', '/'));
  } catch {
    display.innerText = "Error";
  }
}
</script>
</body>
</html>
